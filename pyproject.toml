[project]
name = "palomatrix"
version = "0.1.0"
description = "Ingesta y normalización de datos abiertos de movilidad de Santiago (DTPM y EOD 2012)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eduardo Graells-Garrido" }]
keywords = ["transporte", "movilidad", "santiago", "dtpm", "gtfs", "bip", "eod", "sectra"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geopandas>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
# consolidar_anio procesa un año completo fuera de memoria.
consolidado = ["dask[dataframe]>=2024.1"]
# Gráficos de cobertura y distribución horaria.
diagnosticos = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/PLUMAS-research/palomatrix-dtpm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palomatrix"]
